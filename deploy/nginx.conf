server {
    listen 80;
    server_name dylandw.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/product-workbench-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://dylandw.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dylandw.site;
    ssl_certificate /etc/letsencrypt/live/dylandw.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dylandw.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
