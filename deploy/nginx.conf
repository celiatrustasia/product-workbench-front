server {
    listen 80;
    server_name celiawang.fun www.celiawang.fun;
    return 301 https://celiawang.fun$request_uri;
}

server {
    listen 443 ssl;
    server_name www.celiawang.fun;
    ssl_certificate /etc/product-workbench/tls/celiawang.fun_cert_chain.pem;
    ssl_certificate_key /etc/product-workbench/tls/celiawang.fun_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://celiawang.fun$request_uri;
}

server {
    listen 443 ssl;
    server_name celiawang.fun;
    ssl_certificate /etc/product-workbench/tls/celiawang.fun_cert_chain.pem;
    ssl_certificate_key /etc/product-workbench/tls/celiawang.fun_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
